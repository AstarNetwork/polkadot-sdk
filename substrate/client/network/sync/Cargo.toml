[package]
description = "Substrate sync network protocol"
name = "sc-network-sync"
version = "0.55.1"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
homepage = "https://paritytech.github.io/polkadot-sdk/"
repository = "https://github.com/paritytech/polkadot-sdk.git"
documentation = "https://docs.rs/sc-network-sync"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { version = "6.2.2" }
async-channel = { version = "1.8.0" }
async-trait = { version = "0.1.88" }
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive"] }
fork-tree = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
futures = { version = "0.3.31" }
log = { version = "0.4.22" }
mockall = { version = "0.13.1" }
prometheus-endpoint = { package = "substrate-prometheus-endpoint", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
prost = { version = "0.12.4" }
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sc-network = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sc-network-common = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sc-network-types = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sc-utils = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
schnellru = { version = "0.2.3" }
smallvec = { version = "1.11.0" }
sp-arithmetic = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
thiserror = { version = "1.0.64" }
tokio = { version = "1.45.0", features = ["macros", "time"] }
tokio-stream = { version = "0.1.14" }

[dev-dependencies]
quickcheck = { version = "1.0.3", default-features = false }
sc-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-test-primitives = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
sp-tracing = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }
substrate-test-runtime-client = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2603" }

[build-dependencies]
prost-build = { version = "0.13.2" }
